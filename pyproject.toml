[project]
name = "weather-mcp"
version = "0.1.0"
description = "MCP server providing weather tools via Open-Meteo"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3.1",
    "httpx>=0.27.0",
    "mcp>=1.27.1",
    "pydantic>=2.0.0",
]

[project.scripts]
weather-mcp = "weather_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
